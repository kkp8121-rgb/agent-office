<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에이전트 사무실</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<div id="coins" role="status" aria-label="코인" hidden><i class="coin" aria-hidden="true"></i><b id="coin-n">0</b></div>
<main id="app">
  <div id="floors"></div>
  <div id="pip-hold" hidden>
    <p>작은 창에서 보는 중</p>
    <button id="pip-back" type="button">여기로 되돌리기</button>
  </div>
  <aside id="panel">
    <h2>세션</h2>
    <div id="sessions"></div>
    <div id="empty" hidden>실행 중인 세션이 없습니다. Claude Code나 Codex를 실행하면 층이 생깁니다.</div>
    <h2 class="log-head"><span>기록</span><a href="/log" target="_blank" rel="noopener">전체 기록 ↗</a></h2>
    <div id="log" role="log" aria-label="기록"></div>
    <div class="foot">
      <button id="shop-open" type="button" aria-expanded="false" aria-controls="shop" hidden>상점</button>
      <button id="decorate" type="button" aria-pressed="false" hidden>꾸미기</button>
      <button id="pip" type="button" hidden title="항상 위 작은 창으로 띄우기">작은 창</button>
      <button id="quit" type="button">끄기</button>
    </div>
  </aside>
</main>
<aside id="shop" aria-label="상점" hidden>
  <header><h2 id="shop-title">상점</h2><button id="shop-close" type="button">닫기</button></header>
  <p id="shop-hint"></p>
  <section id="shop-store"><h3>가구</h3><ul id="shop-list"></ul></section>
  <section id="shop-inv"><h3>보관함</h3><ul id="inv-list"></ul><p id="inv-empty">비어 있어요. 상점에서 가구를 사면 여기에 들어와요.</p></section>
</aside>
<div id="toast" role="status" hidden></div>
<div id="conn" role="status" hidden></div>
<script src="/web/logrow.js"></script>
<script type="module" src="/web/app.js"></script>
</body>
</html>
