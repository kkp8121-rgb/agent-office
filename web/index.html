<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에이전트 사무실</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<header id="topbar">
  <nav id="floor-tabs" aria-label="층 전환">
    <span id="tab-list"></span>
    <button id="view-all" type="button" aria-pressed="true" title="모든 층을 쌓아서 보기">전체</button>
  </nav>
  <div class="tb-right">
    <button id="rotate" type="button" aria-pressed="false" title="전체 화면 세션을 차례로 돌려 보기">순환</button>
    <button id="fullscreen" type="button" title="전체 화면으로 보기">전체 화면</button>
    <button id="panel-toggle" type="button" aria-controls="panel" aria-expanded="true">세션 창 숨기기</button>
    <button id="pip" type="button" hidden title="항상 위 작은 창으로 띄우기">작은 창</button>
    <button id="quit" type="button">끄기</button>
  </div>
</header>
<main id="app">
  <div id="floors"></div>
  <div id="pip-hold" hidden>
    <p>작은 창에서 보는 중</p>
    <button id="pip-back" type="button">여기로 되돌리기</button>
  </div>
  <aside id="panel">
    <h2>세션</h2>
    <div id="sessions"></div>
    <div id="empty" hidden>실행 중인 세션이 없습니다. Claude Code나 Codex를 실행하면 층이 생깁니다.</div>
    <h2 class="log-head"><span>기록</span><a href="/log" target="_blank" rel="noopener">전체 기록 ↗</a></h2>
    <div id="log" role="log" aria-label="기록"></div>
  </aside>
</main>
<div id="conn" role="status" hidden></div>
<script src="/web/logrow.js"></script>
<script type="module" src="/web/app.js"></script>
</body>
</html>
